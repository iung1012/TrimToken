port: 8019
anthropic_api_url: "https://api.anthropic.com"

# ─── ROUTING INTELIGENTE ──────────────────────────────────────────
# Roteia automaticamente para o modelo mais barato adequado à tarefa.
# Funciona com API key (economia em $$) e com plano Pro/Max (economia de cota).
routing:
  enabled: true
  cost_threshold: 0.3
  models:
    simple: "claude-haiku-3-5-20241022"
    standard: "claude-sonnet-4-5"
    complex: "claude-opus-4-5"

# ─── PROMPT CACHE NATIVO (cache_control) ──────────────────────────
# Injeta cache_control nos pontos certos para que a Anthropic cobre
# apenas 10% dos tokens repetidos. Funciona via API key.
prompt_cache:
  enabled: true
  min_tokens_to_cache: 1024

# ─── SESSION MEMORY ───────────────────────────────────────────────
# Mantém contexto de conversa entre requisições, evitando reenvio.
session_memory:
  enabled: true
  ttl_seconds: 7200  # 2 horas

# ─── RESPONSE CACHE ───────────────────────────────────────────────
# Cacheia respostas inteiras. Pergunta idêntica = resposta instantânea
# sem gastar nenhum token. Funciona em qualquer plano.
response_cache:
  enabled: true
  ttl_seconds: 3600
  redis_url: ""  # vazio = cache em memória

# ─── OUTPUT COMPRESSION (Caveman) ─────────────────────────────────
# Injeta instruções no system prompt para que o Claude responda de
# forma mais compacta. Reduz output em 40-70%. Funciona em qualquer plano.
# Níveis: off | light | medium | aggressive
output_compress:
  enabled: true
  level: "medium"

# ─── INPUT COMPRESSION (RTK-style) ────────────────────────────────
# Comprime mensagens enviadas removendo whitespace redundante,
# deduplicando linhas e truncando outputs longos. Preserva código.
# Reduz input em 30-70%. Funciona em qualquer plano.
input_compress:
  enabled: true
  level: "medium"
  preserve_last_message: true  # nunca comprime o que o user acabou de pedir

# ─── SMART CODE COMPRESSION (codesight-inspired) ──────────────────
# Detecta blocos de código nas mensagens e comprime function bodies
# em assinaturas, mantendo imports/types/exports.
# Reduz 30-90% em prompts com código bruto. Funciona em qualquer plano.
# Suporta: TypeScript, JavaScript, Python, Go, Java, Rust.
# Níveis: light (>30 linhas) | medium (>15 linhas) | aggressive (>8 linhas)
code_compress:
  enabled: true
  level: "medium"
  preserve_last_message: true

# ─── DASHBOARD ────────────────────────────────────────────────────
dashboard:
  enabled: true
  port: 8019
  path: "/dashboard"

# ─── HTTPS MODE (intercepta Claude Desktop App) ───────────────────
# ATENÇÃO: requer admin, modifica hosts file e instala cert no trust store.
# Use install-https.ps1 (como Administrador) pra configurar.
# Quando ativo, intercepta TODO o tráfego de api.anthropic.com da sua máquina.
https_mode:
  enabled: false           # ative APÓS rodar install-https.ps1
  port: 443
  hostname: "api.anthropic.com"
