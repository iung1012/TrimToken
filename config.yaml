port: 8019
anthropic_api_url: "https://api.anthropic.com"

# === MEDIÇÃO REAL ===========================================================
# Mede a economia chamando count_tokens (tokenizer oficial da Anthropic) no
# request original. É grátis e roda DEPOIS da resposta, sem adicionar latência.
# Com isso o dashboard mostra economia MEDIDA, não estimada.
measure_savings: true

# === RESPONSE CACHE =========================================================
# Resposta idêntica = servida do cache, sem gastar token. 100% lossless.
response_cache:
  enabled: true
  ttl_seconds: 3600
  redis_url: ""   # vazio = cache em memória

# === PROMPT CACHE (cache_control) ===========================================
# Injeta cache_control SÓ quando o cliente não usa cache (ex.: app via API
# crua). Se o cliente já cacheia (Claude Code), não tocamos em nada — assim
# nunca estoura o limite de 4 breakpoints (causa comum de erro 400).
prompt_cache:
  enabled: true
  min_tokens_to_cache: 1024

# === INPUT COMPRESSION ======================================================
# Remove whitespace redundante, deduplica linhas e trunca logs longos.
# Preserva blocos de código e a última mensagem. Níveis: off|light|medium|aggressive
input_compress:
  enabled: true
  level: "medium"
  preserve_last_message: true

# === CODE COMPRESSION =======================================================
# Colapsa corpos de função no HISTÓRICO (mantém imports/types/assinaturas e a
# última mensagem). Reduz muito em prompts com código relido.
# NOTA: pode reduzir a taxa de prompt-cache nativo do Claude Code, pois altera
# o histórico. O dashboard mostra o efeito líquido real — ajuste se necessário.
code_compress:
  enabled: true
  level: "medium"   # light(>30 linhas) | medium(>15) | aggressive(>8)
  preserve_last_message: true

# === OUTPUT COMPRESSION =====================================================
# Instrui o modelo a responder de forma concisa (via system prompt).
# Reduz output real, mas o ganho não é separadamente mensurável — por isso o
# dashboard NÃO credita número falso aqui.
output_compress:
  enabled: true
  level: "medium"   # off | light | medium | aggressive

# === SMART ROUTING ==========================================================
# Roteia tarefas triviais para um modelo mais barato. DESLIGADO por padrão.
# Em safe_only, só troca quando NÃO há tools nem histórico — assim nunca
# rebaixa o modelo no meio de uma sessão do Claude Code (preserva qualidade).
routing:
  enabled: false
  safe_only: true
  models:
    simple: "claude-haiku-4-5"
    standard: "claude-sonnet-4-5"
    complex: "claude-opus-4-5"

# === DASHBOARD ==============================================================
dashboard:
  enabled: true
  path: "/dashboard"

# === HTTPS MODE (intercepta o Claude Desktop App) ===========================
# Requer admin: modifica hosts file e instala um Root CA local.
# Use install-https.ps1. Intercepta TODO tráfego de api.anthropic.com da máquina.
https_mode:
  enabled: false
  port: 443
  hostname: "api.anthropic.com"
